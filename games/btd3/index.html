<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bloons</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: #2a2a2a;
        color: #f6f7fb;
        margin: 0;
        min-height: 100vh;
      }
      main {
        margin: auto;
        max-width: 100%;
        padding: 16px;
      }
      .player-shell {
        background: #151a28;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        height: calc(100vh - 32px);
        overflow: hidden;
        padding: 0;
      }
      #player {
        background: #000;
        border-radius: 24px;
        height: 100%;
        overflow: hidden;
        width: 100%;
      }
      @media (max-width: 600px) {
        .player-shell {
          border-radius: 16px;
          height: calc(100vh - 32px);
        }
        #player {
          border-radius: 16px;
        }
      }
    </style>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
        contextMenu: "off",
        showSwfDownload: false,
        splashScreen: false,
      };
    </script>
    <script src="ruffle.js"></script>
  </head>
  <body>
    <main>
      <div class="player-shell">
        <div id="player" aria-label="Flash Player"></div>
      </div>
    </main>
    <script>
      window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer?.newest();
        if (!ruffle) return;
        const player = ruffle.createPlayer();
        document.querySelector("#player").appendChild(player);
        player.style.width = "100%";
        player.style.height = "100%";
        player.ruffle().load("btd3.swf");
      });
    </script>
  </body>
</html>
